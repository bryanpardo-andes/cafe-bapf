<div class="col-8">
  <table class="table">
    <caption class="visually-hidden">Variedades de café</caption>
    <thead class="table-dark">
      <tr>
        <th scope="col">
          <span aria-hidden="true">#</span>
          <span class="visually-hidden">Número</span>
        </th>
        <th scope="col">Nombre</th>
        <th scope="col">Tipo</th>
        <th scope="col">Región</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let cafe of cafes">
        <td>{{ cafe.id }}</td>
        <td>{{ cafe.nombre }}</td>
        <td>{{ cafe.tipo }}</td>
        <td>{{ cafe.region }}</td>
      </tr>
    </tbody>
  </table>

  <ul class="totales" aria-label="Totales por tipo de café">
    <li *ngFor="let total of totales">Total {{ total[0] }}: {{ total[1] }}</li>
  </ul>
</div>
